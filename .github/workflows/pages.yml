name: Website

# Publishes site/ to GitHub Pages whenever the site changes on main, or when
# started by hand from the Actions tab. Pages must be on (Settings > Pages >
# Source: GitHub Actions).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "tools/site/**", ".github/workflows/pages.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish the website
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the pages are up to date with tools/site/build.py
        run: |
          python3 tools/site/build.py site
          git diff --exit-code -- site || { echo "Run python3 tools/site/build.py and commit the result"; exit 1; }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
